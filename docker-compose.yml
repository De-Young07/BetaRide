services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: betaride
      POSTGRES_PASSWORD: betaride
      POSTGRES_DB: betaride
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./apps/api/sql:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
